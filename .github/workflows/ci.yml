name: CI - Continuous Integration & Quality Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Lint, Test, Integrity & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Test Suite (Unit, Integration & Security)
        run: npm test

      - name: SQLite Relational Integrity & Schema Check
        run: npm run db:integrity

      - name: Vite Frontend Production Build
        run: npm run build
